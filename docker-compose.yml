services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: prg
      POSTGRES_PASSWORD: prg_dev
      POSTGRES_DB: prg
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
 
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
 
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # bandeja web: http://localhost:8025
 
volumes:
  pgdata: