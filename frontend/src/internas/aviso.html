@if (message()) {
  <div
    class="toast visible"
    id="toast"
    [class.ok]="success()"
    [attr.role]="success() ? 'status' : 'alert'"
  >
    <span class="i" aria-hidden="true">{{ success() ? '✓' : '!' }}</span>
    <span id="toastTexto">{{ message() }}</span>
    <button type="button" id="toastCerrar" aria-label="Cerrar mensaje" (click)="dismiss.emit()">
      ×
    </button>
  </div>
}
