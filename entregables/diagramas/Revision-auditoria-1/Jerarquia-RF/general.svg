<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="1000" viewBox="0 0 1250 1000" role="img"><title>Índice de los 16 módulos</title><rect width="100%" height="100%" fill="white"/><text x="45" y="65" font-family="Arial, sans-serif" font-size="30" fill="#111111" font-weight="bold">SUMA | Casos de uso por módulo</text><text x="45" y="110" font-family="Arial, sans-serif" font-size="20" fill="#111111">16 diagramas generales · 50 casos compuestos · 179 subrequisitos</text><text x="45" y="155.0" font-family="Arial, sans-serif" font-size="17" fill="#111111">Agrupación exacta de la columna «Nombre (módulo)» de la hoja «Req. Funcionales» de la matriz corregida. Selecciona un módulo y luego un RF para</text><text x="45" y="175.74" font-family="Arial, sans-serif" font-size="17" fill="#111111">abrir su hijo.</text><rect x="45" y="245" width="560" height="58" rx="7" fill="#ECF3FC" stroke="#222" stroke-width="1.2"/><text x="61" y="269" font-family="Arial, sans-serif" font-size="18" fill="#245B91" font-weight="bold">01  Gestión de usuarios</text><text x="61" y="292" font-family="Arial, sans-serif" font-size="13" fill="#4F6476">7 requisitos funcionales</text><a href="Modulo-01.svg"><rect x="45" y="245" width="560" height="58" fill="transparent"/></a><rect x="45" y="318" width="560" height="58" rx="7" fill="#E8F5F3" stroke="#222" stroke-width="1.2"/><text x="61" y="342" font-family="Arial, sans-serif" font-size="18" fill="#227673" font-weight="bold">02  Validación de usuarios</text><text x="61" y="365" font-family="Arial, sans-serif" font-size="13" fill="#4F6476">2 requisitos funcionales</text><a href="Modulo-02.svg"><rect x="45" y="318" width="560" height="58" fill="transparent"/></a><rect x="45" y="391" width="560" height="58" rx="7" fill="#FFF4E4" stroke="#222" stroke-width="1.2"/><text x="61" y="415" font-family="Arial, sans-serif" font-size="18" fill="#906123" font-weight="bold">03  Administración</text><text x="61" y="438" font-family="Arial, sans-serif" font-size="13" fill="#4F6476">5 requisitos funcionales</text><a href="Modulo-03.svg"><rect x="45" y="391" width="560" height="58" fill="transparent"/></a><rect x="45" y="464" width="560" height="58" rx="7" fill="#ECF6ED" stroke="#222" stroke-width="1.2"/><text x="61" y="488" font-family="Arial, sans-serif" font-size="18" fill="#397A4A" font-weight="bold">04  Referidos</text><text x="61" y="511" font-family="Arial, sans-serif" font-size="13" fill="#4F6476">3 requisitos funcionales</text><a href="Modulo-04.svg"><rect x="45" y="464" width="560" height="58" fill="transparent"/></a><rect x="45" y="537" width="560" height="58" rx="7" fill="#F2EDFA" stroke="#222" stroke-width="1.2"/><text x="61" y="561" font-family="Arial, sans-serif" font-size="18" fill="#75539C" font-weight="bold">05  Puntos y recompensas</text><text x="61" y="584" font-family="Arial, sans-serif" font-size="13" fill="#4F6476">6 requisitos funcionales</text><a href="Modulo-05.svg"><rect x="45" y="537" width="560" height="58" fill="transparent"/></a><rect x="45" y="610" width="560" height="58" rx="7" fill="#ECF3FC" stroke="#222" stroke-width="1.2"/><text x="61" y="634" font-family="Arial, sans-serif" font-size="18" fill="#245B91" font-weight="bold">06  Gamificación</text><text x="61" y="657" font-family="Arial, sans-serif" font-size="13" fill="#4F6476">3 requisitos funcionales</text><a href="Modulo-06.svg"><rect x="45" y="610" width="560" height="58" fill="transparent"/></a><rect x="45" y="683" width="560" height="58" rx="7" fill="#E8F5F3" stroke="#222" stroke-width="1.2"/><text x="61" y="707" font-family="Arial, sans-serif" font-size="18" fill="#227673" font-weight="bold">07  Juegos</text><text x="61" y="730" font-family="Arial, sans-serif" font-size="13" fill="#4F6476">2 requisitos funcionales</text><a href="Modulo-07.svg"><rect x="45" y="683" width="560" height="58" fill="transparent"/></a><rect x="45" y="756" width="560" height="58" rx="7" fill="#FFF4E4" stroke="#222" stroke-width="1.2"/><text x="61" y="780" font-family="Arial, sans-serif" font-size="18" fill="#906123" font-weight="bold">08  Capacitaciones</text><text x="61" y="803" font-family="Arial, sans-serif" font-size="13" fill="#4F6476">2 requisitos funcionales</text><a href="Modulo-08.svg"><rect x="45" y="756" width="560" height="58" fill="transparent"/></a><rect x="650" y="245" width="560" height="58" rx="7" fill="#ECF6ED" stroke="#222" stroke-width="1.2"/><text x="666" y="269" font-family="Arial, sans-serif" font-size="18" fill="#397A4A" font-weight="bold">09  Talleres</text><text x="666" y="292" font-family="Arial, sans-serif" font-size="13" fill="#4F6476">3 requisitos funcionales</text><a href="Modulo-09.svg"><rect x="650" y="245" width="560" height="58" fill="transparent"/></a><rect x="650" y="318" width="560" height="58" rx="7" fill="#F2EDFA" stroke="#222" stroke-width="1.2"/><text x="666" y="342" font-family="Arial, sans-serif" font-size="18" fill="#75539C" font-weight="bold">10  Comunidad</text><text x="666" y="365" font-family="Arial, sans-serif" font-size="13" fill="#4F6476">5 requisitos funcionales</text><a href="Modulo-10.svg"><rect x="650" y="318" width="560" height="58" fill="transparent"/></a><rect x="650" y="391" width="560" height="58" rx="7" fill="#ECF3FC" stroke="#222" stroke-width="1.2"/><text x="666" y="415" font-family="Arial, sans-serif" font-size="18" fill="#245B91" font-weight="bold">11  Salud y bienestar</text><text x="666" y="438" font-family="Arial, sans-serif" font-size="13" fill="#4F6476">1 requisitos funcionales</text><a href="Modulo-11.svg"><rect x="650" y="391" width="560" height="58" fill="transparent"/></a><rect x="650" y="464" width="560" height="58" rx="7" fill="#E8F5F3" stroke="#222" stroke-width="1.2"/><text x="666" y="488" font-family="Arial, sans-serif" font-size="18" fill="#227673" font-weight="bold">12  Búsquedas</text><text x="666" y="511" font-family="Arial, sans-serif" font-size="13" fill="#4F6476">1 requisitos funcionales</text><a href="Modulo-12.svg"><rect x="650" y="464" width="560" height="58" fill="transparent"/></a><rect x="650" y="537" width="560" height="58" rx="7" fill="#FFF4E4" stroke="#222" stroke-width="1.2"/><text x="666" y="561" font-family="Arial, sans-serif" font-size="18" fill="#906123" font-weight="bold">13  Notificaciones</text><text x="666" y="584" font-family="Arial, sans-serif" font-size="13" fill="#4F6476">4 requisitos funcionales</text><a href="Modulo-13.svg"><rect x="650" y="537" width="560" height="58" fill="transparent"/></a><rect x="650" y="610" width="560" height="58" rx="7" fill="#ECF6ED" stroke="#222" stroke-width="1.2"/><text x="666" y="634" font-family="Arial, sans-serif" font-size="18" fill="#397A4A" font-weight="bold">14  Reportes</text><text x="666" y="657" font-family="Arial, sans-serif" font-size="13" fill="#4F6476">2 requisitos funcionales</text><a href="Modulo-14.svg"><rect x="650" y="610" width="560" height="58" fill="transparent"/></a><rect x="650" y="683" width="560" height="58" rx="7" fill="#F2EDFA" stroke="#222" stroke-width="1.2"/><text x="666" y="707" font-family="Arial, sans-serif" font-size="18" fill="#75539C" font-weight="bold">15  Encuestas</text><text x="666" y="730" font-family="Arial, sans-serif" font-size="13" fill="#4F6476">1 requisitos funcionales</text><a href="Modulo-15.svg"><rect x="650" y="683" width="560" height="58" fill="transparent"/></a><rect x="650" y="756" width="560" height="58" rx="7" fill="#ECF3FC" stroke="#222" stroke-width="1.2"/><text x="666" y="780" font-family="Arial, sans-serif" font-size="18" fill="#245B91" font-weight="bold">16  Usuarios y perfiles</text><text x="666" y="803" font-family="Arial, sans-serif" font-size="13" fill="#4F6476">3 requisitos funcionales</text><a href="Modulo-16.svg"><rect x="650" y="756" width="560" height="58" fill="transparent"/></a><text x="45" y="895.0" font-family="Arial, sans-serif" font-size="17" fill="#111111">Se conserva el diseño de clases revisado y la validación automática de cuentas y referidos. En Enterprise Architect, cada RF abre su hijo con doble clic.</text><text x="45" y="915.74" font-family="Arial, sans-serif" font-size="17" fill="#111111">En el PDF y SVG, se abre con un clic.</text></svg>