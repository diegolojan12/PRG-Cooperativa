ar (Premios)</text><ellipse cx="1245.0" cy="606.0" rx="215.0" ry="46.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><text x="1245.0" y="611.0" font-family="Arial, sans-serif" font-size="16" fill="#111111" text-anchor="middle">RF-13-4 Crear (Provincias)</text><ellipse cx="1245.0" cy="736.0" rx="215.0" ry="46.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><text x="1245.0" y="741.0" font-family="Arial, sans-serif" font-size="16" fill="#111111" text-anchor="middle">RF-13-5 Actualizar (Estado)</text><ellipse cx="1245.0" cy="866.0" rx="215.0" ry="46.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><text x="1245.0" y="871.0" font-family="Arial, sans-serif" font-size="16" fill="#111111" text-anchor="middle">RF-13-6 Eliminar (Cierre)</text><ellipse cx="1245.0" cy="996.0" rx="215.0" ry="46.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><text x="1245.0" y="1001.0" font-family="Arial, sans-serif" font-size="16" fill="#111111" text-anchor="middle">RF-13-7 Validar (Superposición)</text><ellipse cx="1245.0" cy="1126.0" rx="215.0" ry="46.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><text x="1245.0" y="1131.0" font-family="Arial, sans-serif" font-size="16" fill="#111111" text-anchor="middle">RF-13-8 Leer (Campañas vigentes)</text><ellipse cx="140.5" cy="195.0" rx="10.0" ry="10.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><polyline points="140.5,205.0 140.5,244.0" fill="none" stroke="#222" stroke-width="1.2"/><polyline points="116.5,219.0 164.5,219.0" fill="none" stroke="#222" stroke-width="1.2"/><polyline points="140.5,244.0 120.5,267.0" fill="none" stroke="#222" stroke-width="1.2"/><polyline points="140.5,244.0 160.5,267.0" fill="none" stroke="#222" stroke-width="1.2"/><text x="140.5" y="290.0" font-family="Arial, sans-serif" font-size="14" fill="#111111" font-weight="bold" text-anchor="middle">Administrador</text><text x="35" y="1415.0" font-family="Arial, sans-serif" font-size="15" fill="#111111">El sistema deberá permitir al administrador gestiona