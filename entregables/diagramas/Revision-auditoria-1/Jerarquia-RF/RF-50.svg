<svg xmlns="http://www.w3.org/2000/svg" width="1810" height="1050" viewBox="0 0 1810 1050" role="img"><title>RF-50 Hijo - Validación automática contra la base institucional</title><rect width="100%" height="100%" fill="white"/><text x="30" y="35" font-family="Arial, sans-serif" font-size="22" fill="#111111" font-weight="bold">RF-50 Hijo - Validación automática contra la base institucional</text><text x="30" y="60" font-family="Arial, sans-serif" font-size="13" fill="#111111">SUMA | 26 de noviembre de 2026 | Matriz de requisitos corregida</text><rect x="310" y="120" width="1210" height="700" rx="0" fill="#FFFFFF" stroke="#222" stroke-width="1.2"/><text x="915.0" y="148" font-family="Arial, sans-serif" font-size="17" fill="#111111" font-weight="bold" text-anchor="middle">Sistema SUMA</text><text x="1630" y="34" font-family="Arial, sans-serif" font-size="14" fill="#174F83" font-weight="bold">Volver al general</text><a href="Modulo-01.svg"><rect x="1615" y="14" width="180" height="32" fill="transparent"/></a><polyline points="630.0,391.3 850.0,216.0 1030.0,216.0" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4"/><polyline points="1017.0,222.0 1030.0,216.0 1017.0,210.0" fill="none" stroke="#222" stroke-width="1.2"/><rect x="863.171875" y="196" width="63.65625000000001" height="17" fill="white"/><text x="895" y="209" font-family="Arial, sans-serif" font-size="13" fill="#111111" text-anchor="middle">«include»</text><polyline points="690.7,400.9 850.0,346.0 1030.0,346.0" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4"/><polyline points="1017.0,352.0 1030.0,346.0 1017.0,340.0" fill="none" stroke="#222" stroke-width="1.2"/><rect x="863.171875" y="326" width="63.65625000000001" height="17" fill="white"/><text x="895" y="339" font-family="Arial, sans-serif" font-size="13" fill="#111111" text-anchor="middle">«include»</text><polyline points="1550.0,230.0 1510.0,230.0 1510.0,135.0 1245.0,135.0 1245.0,170.0" fill="none" stroke="#222" stroke-width="1.2"/><ellipse cx="562.5" cy="445.0" rx="202.5" ry="57.0" fill="#DCE8F3" stroke="#222" stroke-width="1.3"/><text x="562.5" y="441.0" font-family="Arial, sans-serif" font-size="16" fill="#111111" text-anchor="middle">RF-50 Validación automática contra la base</text><text x="562.5" y="460.52" font-family="Arial, sans-serif" font-size="16" fill="#111111" text-anchor="middle">institucional</text><text x="720" y="492.0" font-family="Arial, sans-serif" font-size="16" fill="#111111">∞</text><ellipse cx="1245.0" cy="216.0" rx="215.0" ry="46.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><text x="1245.0" y="221.0" font-family="Arial, sans-serif" font-size="16" fill="#111111" text-anchor="middle">RF-50-1 Leer (Consulta)</text><ellipse cx="1245.0" cy="346.0" rx="215.0" ry="46.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><text x="1245.0" y="342.0" font-family="Arial, sans-serif" font-size="16" fill="#111111" text-anchor="middle">RF-50-2 Actualizar (Resultado y reintento</text><text x="1245.0" y="361.52" font-family="Arial, sans-serif" font-size="16" fill="#111111" text-anchor="middle">automático)</text><rect x="1550" y="180" width="225" height="120" rx="4" fill="#E7E7E7" stroke="#222" stroke-width="1.2"/><text x="1662.5" y="202" font-family="Arial, sans-serif" font-size="12" fill="#111111" text-anchor="middle">«servicio externo»</text><text x="1662.5" y="227.0" font-family="Arial, sans-serif" font-size="14" fill="#111111" font-weight="bold" text-anchor="middle">Fuente institucional de la</text><text x="1662.5" y="244.07999999999998" font-family="Arial, sans-serif" font-size="14" fill="#111111" font-weight="bold" text-anchor="middle">Cooperativa</text><text x="35" y="915.0" font-family="Arial, sans-serif" font-size="15" fill="#111111">El sistema deberá validar automáticamente existencia, titularidad y condición habilitada de las cuentas de asociados y referidos contra registros institucionales autorizados en máximo 5 segundos con la fuente disponible y vigente, sin intervención del</text><text x="35" y="933.3" font-family="Arial, sans-serif" font-size="15" fill="#111111">administrador.</text><text x="35" y="1002" font-family="Arial, sans-serif" font-size="12" fill="#111111">Línea continua: participación | «include»: requerido | «extend»: condición indicada | ∞: caso compuesto</text><text x="1760" y="1030" font-family="Arial, sans-serif" font-size="12" fill="#111111">67</text></svg>