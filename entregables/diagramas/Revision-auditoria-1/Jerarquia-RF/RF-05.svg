13" fill="#111111" text-anchor="middle">«extend»</text><rect x="822.06689453125" y="831" width="145.8662109375" height="14" fill="white"/><text x="895" y="841" font-family="Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle">[corrige una cuenta rechazada]</text><polyline points="174.2,219.0 501.5,510.6" fill="none" stroke="#222" stroke-width="1.2"/><polyline points="174.2,404.0 290.0,404.0 290.0,135.0 1000.0,135.0 1000.0,476.0 1030.0,476.0" fill="none" stroke="#222" stroke-width="1.2"/><ellipse cx="562.5" cy="565.0" rx="202.5" ry="57.0" fill="#DCE8F3" stroke="#222" stroke-width="1.3"/><text x="562.5" y="561.0" font-family="Arial, sans-serif" font-size="16" fill="#111111" text-anchor="middle">RF-05 Vinculación y validación automática</text><text x="562.5" y="580.52" font-family="Arial, sans-serif" font-size="16" fill="#111111" text-anchor="middle">de cuenta</text><text x="720" y="612.0" font-family="Arial, sans-serif" font-size="16" fill="#111111">∞</text><ellipse cx="1245.0" cy="216.0" rx="215.0" ry="46.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><text x="1245.0" y="221.0" font-family="Arial, sans-serif" font-size="16" fill="#111111" text-anchor="middle">RF-05-1 Crear (Datos de la cuenta)</text><ellipse cx="1245.0" cy="346.0" rx="215.0" ry="46.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><text x="1245.0" y="351.0" font-family="Arial, sans-serif" font-size="16" fill="#111111" text-anchor="middle">RF-05-2 Validar (Unicidad)</text><ellipse cx="1245.0" cy="476.0" rx="215.0" ry="46.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><text x="1245.0" y="481.0" font-family="Arial, sans-serif" font-size="16" fill="#111111" text-anchor="middle">RF-05-3 Leer (Seguimiento de validaciones)</text><ellipse cx="1245.0" cy="606.0" rx="215.0" ry="46.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><text x="1245.0" y="611.0" font-family="Arial, sans-serif" font-size="16" fill="#111111" text-anchor="middle">RF-05-4 Actualizar (Resultado automático)</text><ellipse cx="1245.0" cy="736.0" rx="215.0" ry="46.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><text x="1245.0" y="741.0" font-family="Arial, sans-serif" font-size="16" fill="#111111" text-anchor="middle">RF-05-5 Leer (Enmascarado)</text><ellipse cx="1245.0" cy="866.0" rx="215.0" ry="46.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><text x="1245.0" y="871.0" font-family="Arial, sans-serif" font-size="16" fill="#111111" text-anchor="middle">RF-05-6 Actualizar (Nuevo intento)</text><ellipse cx="140.5" cy="195.0" rx="10.0" ry="10.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><polyline points="140.5,205.0 140.5,244.0" fill="none" stroke="#222" stroke-width="1.2"/><polyline points="116.5,219.0 164.5,219.0" fill="none" stroke="#222" stroke-width="1.2"/><polyline points="140.5,244.0 120.5,267.0" fill="none" stroke="#222" stroke-width="1.2"/><polyline points="140.5,244.0 160.5,267.0" fill="none" stroke="#222" stroke-width="1.2"/><text x="140.5" y="290.0" font-family="Arial, sans-serif" font-size="14" fill="#111111" font-weight="bold" text-anchor="middle">Socio / Cliente</text><ellipse cx="140.5" cy="380.0" rx="10.0" ry="10.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><polyline points="140.5,390.0 140.5,429.0" fill="none" stroke="#222" stroke-width="1.2"/><polyline points="116.5,404.0 164.5,404.0" fill="none" stroke="#222" stroke-width="1.2"/><polyline points="140.5,429.0 120.5,452.0" fill="none" stroke="#222" stroke-width="1.2"/><polyline points="140.5,429.0 160.5,452.0" fill="none" stroke="#222" stroke-width="1.2"/><text x="140.5" y="475.0" font-family="Arial, sans-serif" font-size="14" fill="#111111" font-weight="bold" text-anchor="middle">Administrador</text><text x="35" y="1155.0" font-family="Arial, sans-serif" font-size="15" fill="#111111">El sistema deberá registrar la solicitud de vinculación en máximo 3 segundos e iniciar automáticamente la validación de existencia, titularidad y condición habilitada contra la base institucional autorizada (RF-50), sin intervención del administrador.</text><text x="35" y="1242" font-family="Arial, sans-serif" font-size="12" fill="#111111">Línea continua: participación | «include»: requerido | «extend»: condición indicada | ∞: caso compuesto</text><text x="1760" y="1270" font-family="Arial, sans-serif" font-size="12" fill="#111111">22</text></svg>