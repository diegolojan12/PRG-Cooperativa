ly="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">CU-02.3 Solicitar recuperación de acceso</text><ellipse cx="1200.0" cy="465.0" rx="200.0" ry="39.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><text x="1200.0" y="470.0" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">CU-02.6 Cerrar sesión</text><ellipse cx="1200.0" cy="577.0" rx="200.0" ry="39.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><text x="1200.0" y="582.0" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">CU-02.4 Cargar el menú y los permisos del rol</text><ellipse cx="140.0" cy="125.0" rx="10.0" ry="10.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><polyline points="140.0,135.0 140.0,165.0" fill="none" stroke="#222" stroke-width="1.2"/><polyline points="120.0,149.0 160.0,149.0" fill="none" stroke="#222" stroke-width="1.2"/><polyline points="140.0,165.0 124.0,184.0" fill="none" stroke="#222" stroke-width="1.2"/><polyline points="140.0,165.0 156.0,184.0" fill="none" stroke="#222" stroke-width="1.2"/><text x="140.0" y="202.0" font-family="Arial, sans-serif" font-size="13" fill="#111111" font-weight="bold" text-anchor="middle">Usuario de la plataforma</text><rect x="1450" y="125" width="210" height="90" rx="7" fill="#E7E7E7" stroke="#222" stroke-width="1.2"/><text x="1555.0" y="145" font-family="Arial, sans-serif" font-size="12" fill="#111111" text-anchor="middle">«servicio externo»</text><text x="1555.0" y="169.0" font-family="Arial, sans-serif" font-size="14" fill="#111111" font-weight="bold" text-anchor="middle">Servicio de correo</text><text x="35" y="765.0" font-family="Arial, sans-serif" font-size="14" fill="#111111">Consultar el caso y sus variantes de acuerdo con permisos, propiedad y condiciones de negocio. RF-49 transversal: ayuda de campos, errores y resultados comprensibles.</text><text x="35" y="865" font-family="Arial, sans-serif" font-size="12" fill="#111111">Notación: asociación continua; «include» obligatorio; «extend» condicional, dirigido hacia el caso base.</text><text x="1755" y="895" font-family="Arial, sans-serif" font-size="12" fill="#111111" text-anchor="middle">10</text></svg>