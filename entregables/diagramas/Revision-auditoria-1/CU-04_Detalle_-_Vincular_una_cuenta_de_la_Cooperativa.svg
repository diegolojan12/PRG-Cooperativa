.0" cy="344.0" rx="180.0" ry="49.0" fill="#DCE8F3" stroke="#222" stroke-width="1.3"/><text x="540.0" y="333.0" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">CU-04 Vincular una cuenta de la</text><text x="540.0" y="350.08" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">Cooperativa</text><text x="540.0" y="367.15999999999997" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">RF-05, RF-06, RF-50</text><ellipse cx="1200.0" cy="129.0" rx="200.0" ry="39.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><text x="1200.0" y="126.0" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">CU-04.1 Validar los datos y la unicidad de la</text><text x="1200.0" y="143.07999999999998" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">cuenta</text><ellipse cx="1200.0" cy="241.0" rx="200.0" ry="39.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><text x="1200.0" y="238.0" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">CU-04.2 Registrar la solicitud de validación</text><text x="1200.0" y="255.07999999999998" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">automática</text><ellipse cx="1200.0" cy="353.0" rx="200.0" ry="39.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><text x="1200.0" y="350.0" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">CU-18 Validar automáticamente una cuenta</text><text x="1200.0" y="367.08" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">vinculada</text><ellipse cx="140.0" cy="125.0" rx="10.0" ry="10.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><polyline points="140.0,135.0 140.0,165.0" fill="none" stroke="#222" stroke-width="1.2"/><polyline points="120.0,149.0 160.0,149.0" fill="none" stroke="#222" stroke-width="1.2"/><polyline points="140.0,165.0 124.0,184.0" fill="none" stroke="#222" stroke-width="1.2"/><polyline points="140.0,165.0 156.0,184.0" fill="none" stroke="#222" stroke-width="1.2"/><text x="140.0" y="202.0" font-family="Arial, sans-serif" font-size="13" fill="#111111" font-weight="bold" text-anchor="middle">Prospecto</text><ellipse cx="140.0" cy="285.0" rx="10.0" ry="10.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><polyline points="140.0,295.0 140.0,325.0" fill="none" stroke="#222" stroke-width="1.2"/><polyline points="120.0,309.0 160.0,309.0" fill="none" stroke="#222" stroke-width="1.2"/><polyline points="140.0,325.0 124.0,344.0" fill="none" stroke="#222" stroke-width="1.2"/><polyline points="140.0,325.0 156.0,344.0" fill="none" stroke="#222" stroke-width="1.2"/><text x="140.0" y="362.0" font-family="Arial, sans-serif" font-size="13" fill="#111111" font-weight="bold" text-anchor="middle">Socio / Cliente</text><text x="35" y="715.0" font-family="Arial, sans-serif" font-size="14" fill="#111111">El participante declara su cuenta; SUMA valida formato y unicidad y consulta automáticamente la fuente institucional. La administración no decide resultados. RF-49 transversal: ayuda de campos, errores y resultados comprensibles.</text><text x="35" y="815" font-family="Arial, sans-serif" font-size="12" fill="#111111">Notación: asociación continua; «include» obligatorio; «extend» condicional, dirigido hacia el caso base.</text><text x="1505" y="845" font-family="Arial, sans-serif" font-size="12" fill="#111111" text-anchor="middle">12</text></svg>