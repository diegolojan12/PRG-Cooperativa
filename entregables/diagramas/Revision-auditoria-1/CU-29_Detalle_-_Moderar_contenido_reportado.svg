" stroke="#222" stroke-width="1.2"/><polyline points="120.0,149.0 160.0,149.0" fill="none" stroke="#222" stroke-width="1.2"/><polyline points="140.0,165.0 124.0,184.0" fill="none" stroke="#222" stroke-width="1.2"/><polyline points="140.0,165.0 156.0,184.0" fill="none" stroke="#222" stroke-width="1.2"/><text x="140.0" y="202.0" font-family="Arial, sans-serif" font-size="13" fill="#111111" font-weight="bold" text-anchor="middle">Gestor de contenidos</text><ellipse cx="140.0" cy="285.0" rx="10.0" ry="10.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><polyline points="140.0,295.0 140.0,325.0" fill="none" stroke="#222" stroke-width="1.2"/><polyline points="120.0,309.0 160.0,309.0" fill="none" stroke="#222" stroke-width="1.2"/><polyline points="140.0,325.0 124.0,344.0" fill="none" stroke="#222" stroke-width="1.2"/><polyline points="140.0,325.0 156.0,344.0" fill="none" stroke="#222" stroke-width="1.2"/><text x="140.0" y="362.0" font-family="Arial, sans-serif" font-size="13" fill="#111111" font-weight="bold" text-anchor="middle">Administrador</text><text x="35" y="715.0" font-family="Arial, sans-serif" font-size="14" fill="#111111">El administrador elimina o restaura el contenido oculto por 3 reportes, o lo oculta sin reportes. RF-49 transversal: ayuda de campos, errores y resultados comprensibles.</text><text x="35" y="815" font-family="Arial, sans-serif" font-size="12" fill="#111111">Notación: asociación continua; «include» obligatorio; «extend» condicional, dirigido hacia el caso base.</text><text x="1505" y="845" font-family="Arial, sans-serif" font-size="12" fill="#111111" text-anchor="middle">37</text></svg>