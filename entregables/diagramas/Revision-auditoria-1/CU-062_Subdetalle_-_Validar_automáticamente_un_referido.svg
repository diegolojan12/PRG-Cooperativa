<svg xmlns="http://www.w3.org/2000/svg" width="1550" height="855" viewBox="0 0 1550 855" role="img"><title>CU-06.2 Subdetalle - Validar automáticamente un referido</title><rect width="100%" height="100%" fill="white"/><rect x="290" y="25" width="1150" height="630" rx="10" fill="#FFFFFF" stroke="#222" stroke-width="1.2"/><text x="865.0" y="49" font-family="Arial, sans-serif" font-size="16" fill="#111111" font-weight="bold" text-anchor="middle">Sistema SUMA</text><polyline points="1097.3,162.5 655.4,306.4" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4"/><polyline points="665.9,296.7 655.4,306.4 669.6,308.1" fill="none" stroke="#222" stroke-width="1.2"/><rect x="819.254150390625" y="223.01515151515153" width="61.49169921875001" height="17" fill="white"/><text x="850" y="236.01515151515153" font-family="Arial, sans-serif" font-size="13" fill="#111111" text-anchor="middle">«extend»</text><rect x="755.805908203125" y="243.01515151515153" width="188.38818359375" height="15" fill="white"/><text x="850" y="254.01515151515153" font-family="Arial, sans-serif" font-size="11" fill="#111111" text-anchor="middle">[referido aprobado automáticamente]</text><polyline points="696.2,319.6 1043.8,265.4" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4"/><polyline points="1031.9,273.3 1043.8,265.4 1030.1,261.4" fill="none" stroke="#222" stroke-width="1.2"/><rect x="818.171875" y="275.6212121212121" width="63.65625000000001" height="17" fill="white"/><text x="850" y="288.6212121212121" font-family="Arial, sans-serif" font-size="13" fill="#111111" text-anchor="middle">«include»</text><polyline points="719.8,346.5 1000.5,350.3" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4"/><polyline points="987.4,356.1 1000.5,350.3 987.6,344.1" fill="none" stroke="#222" stroke-width="1.2"/><rect x="818.171875" y="328.22727272727275" width="63.65625000000001" height="17" fill="white"/><text x="850" y="341.22727272727275" font-family="Arial, sans-serif" font-size="13" fill="#111111" text-anchor="middle">«include»</text><polyline points="689.3,371.4 1054.3,438.3" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4"/><polyline points="1040.4,441.8 1054.3,438.3 1042.6,430.0" fill="none" stroke="#222" stroke-width="1.2"/><rect x="818.171875" y="380.83333333333337" width="63.65625000000001" height="17" fill="white"/><text x="850" y="393.83333333333337" font-family="Arial, sans-serif" font-size="13" fill="#111111" text-anchor="middle">«include»</text><ellipse cx="540.0" cy="344.0" rx="180.0" ry="49.0" fill="#DCE8F3" stroke="#222" stroke-width="1.3"/><text x="540.0" y="333.0" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">CU-06.2 Validar automáticamente un</text><text x="540.0" y="350.08" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">referido</text><text x="540.0" y="367.15999999999997" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">RF-11-4</text><ellipse cx="1200.0" cy="129.0" rx="200.0" ry="39.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><text x="1200.0" y="126.0" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">CU-06.4 Acreditar puntos a ambas partes una</text><text x="1200.0" y="143.07999999999998" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">sola vez</text><ellipse cx="1200.0" cy="241.0" rx="200.0" ry="39.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><text x="1200.0" y="238.0" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">CU-06.2.1 Comprobar registro activo y cuenta</text><text x="1200.0" y="255.07999999999998" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">validada</text><ellipse cx="1200.0" cy="353.0" rx="200.0" ry="39.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><text x="1200.0" y="358.0" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">CU-06.2.2 Comprobar referidor y relación única</text><ellipse cx="1200.0" cy="465.0" rx="200.0" ry="39.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><text x="1200.0" y="462.0" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">CU-06.2.3 Persistir decisión automática y</text><text x="1200.0" y="479.08" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">evidencia</text><text x="35" y="715.0" font-family="Arial, sans-serif" font-size="14" fill="#111111">SUMA comprueba registro activo, cuenta validada, referidor habilitado y relación válida y única. Aprueba o rechaza por evidencia; falta de requisitos o fallo técnico conserva Pendiente. Sin dictamen administrativo. RF-49 transversal: ayuda</text><text x="35" y="732.08" font-family="Arial, sans-serif" font-size="14" fill="#111111">de campos, errores y resultados comprensibles.</text><text x="35" y="815" font-family="Arial, sans-serif" font-size="12" fill="#111111">Notación: asociación continua; «include» obligatorio; «extend» condicional, dirigido hacia el caso base.</text><text x="1505" y="845" font-family="Arial, sans-serif" font-size="12" fill="#111111" text-anchor="middle">49</text></svg>