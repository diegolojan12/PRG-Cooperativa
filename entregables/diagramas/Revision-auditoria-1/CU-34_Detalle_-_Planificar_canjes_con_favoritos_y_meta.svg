sharray="6 4"/><polyline points="703.2,367.8 689.3,371.4 701.0,379.6" fill="none" stroke="#222" stroke-width="1.2"/><rect x="819.254150390625" y="380.83333333333337" width="61.49169921875001" height="17" fill="white"/><text x="850" y="393.83333333333337" font-family="Arial, sans-serif" font-size="13" fill="#111111" text-anchor="middle">«extend»</text><ellipse cx="540.0" cy="344.0" rx="180.0" ry="49.0" fill="#DCE8F3" stroke="#222" stroke-width="1.3"/><text x="540.0" y="341.0" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">CU-34 Planificar canjes con favoritos y meta</text><text x="540.0" y="358.08" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">RF-34, RF-35</text><ellipse cx="1200.0" cy="129.0" rx="200.0" ry="39.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><text x="1200.0" y="134.0" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">CU-34.1 Consultar favoritos, meta y saldo</text><ellipse cx="1200.0" cy="241.0" rx="200.0" ry="39.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><text x="1200.0" y="246.0" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">CU-34.2 Guardar o quitar premios favoritos</text><ellipse cx="1200.0" cy="353.0" rx="200.0" ry="39.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><text x="1200.0" y="358.0" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">CU-34.3 Elegir un premio como meta</text><ellipse cx="1200.0" cy="465.0" rx="200.0" ry="39.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><text x="1200.0" y="462.0" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">CU-34.4 Calcular los puntos faltantes para la</text><text x="1200.0" y="479.08" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">meta</text><ellipse cx="140.0" cy="125.0" rx="10.0" ry="10.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><polyline points="140.0,135.0 140.0,165.0" fill="none" stroke="#222" stroke-width="1.2"/><polyline points="120.0,149.0 160.0,149.0" fill="none" stroke="#222" stroke-width="1.2"/><polyline points="140.0,165.0 124.0,184.0" fill="none" stroke="#222" stroke-width="1.2"/><polyline points="140.0,165.0 156.0,184.0" fill="none" stroke="#222" stroke-width="1.2"/><text x="140.0" y="202.0" font-family="Arial, sans-serif" font-size="13" fill="#111111" font-weight="bold" text-anchor="middle">Socio / Cliente</text><text x="35" y="715.0" font-family="Arial, sans-serif" font-size="14" fill="#111111">El socio guarda premios favoritos, elige uno como meta y ve cuántos puntos le faltan. RF-49 transversal: ayuda de campos, errores y resultados comprensibles.</text><text x="35" y="815" font-family="Arial, sans-serif" font-size="12" fill="#111111">Notación: asociación continua; «include» obligatorio; «extend» condicional, dirigido hacia el caso base.</text><text x="1505" y="845" font-family="Arial, sans-serif" font-size="12" fill="#111111" text-anchor="middle">42</text></svg>