<svg xmlns="http://www.w3.org/2000/svg" width="1550" height="855" viewBox="0 0 1550 855" role="img"><title>CU-24 Detalle - Gestionar el banco de preguntas</title><rect width="100%" height="100%" fill="white"/><rect x="290" y="25" width="1150" height="630" rx="10" fill="#FFFFFF" stroke="#222" stroke-width="1.2"/><text x="865.0" y="49" font-family="Arial, sans-serif" font-size="16" fill="#111111" font-weight="bold" text-anchor="middle">Sistema SUMA</text><polyline points="160.0,149.0 450.1,301.5" fill="none" stroke="#222" stroke-width="1.2"/><polyline points="1097.3,162.5 655.4,306.4" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4"/><polyline points="665.9,296.7 655.4,306.4 669.6,308.1" fill="none" stroke="#222" stroke-width="1.2"/><rect x="819.254150390625" y="223.01515151515153" width="61.49169921875001" height="17" fill="white"/><text x="850" y="236.01515151515153" font-family="Arial, sans-serif" font-size="13" fill="#111111" text-anchor="middle">«extend»</text><polyline points="1043.8,265.4 696.2,319.6" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4"/><polyline points="708.1,311.7 696.2,319.6 709.9,323.6" fill="none" stroke="#222" stroke-width="1.2"/><rect x="819.254150390625" y="275.6212121212121" width="61.49169921875001" height="17" fill="white"/><text x="850" y="288.6212121212121" font-family="Arial, sans-serif" font-size="13" fill="#111111" text-anchor="middle">«extend»</text><polyline points="160.0,149.0 1001.6,133.9" fill="none" stroke="#222" stroke-width="1.2"/><ellipse cx="540.0" cy="344.0" rx="180.0" ry="49.0" fill="#DCE8F3" stroke="#222" stroke-width="1.3"/><text x="540.0" y="341.0" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">CU-24 Gestionar el banco de preguntas</text><text x="540.0" y="358.08" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">RF-19</text><ellipse cx="1200.0" cy="129.0" rx="200.0" ry="39.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><text x="1200.0" y="134.0" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">CU-24.1 Crear o editar una pregunta</text><ellipse cx="1200.0" cy="241.0" rx="200.0" ry="39.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><text x="1200.0" y="246.0" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">CU-24.2 Desactivar una pregunta</text><ellipse cx="140.0" cy="125.0" rx="10.0" ry="10.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><polyline points="140.0,135.0 140.0,165.0" fill="none" stroke="#222" stroke-width="1.2"/><polyline points="120.0,149.0 160.0,149.0" fill="none" stroke="#222" stroke-width="1.2"/><polyline points="140.0,165.0 124.0,184.0" fill="none" stroke="#222" stroke-width="1.2"/><polyline points="140.0,165.0 156.0,184.0" fill="none" stroke="#222" stroke-width="1.2"/><text x="140.0" y="202.0" font-family="Arial, sans-serif" font-size="13" fill="#111111" font-weight="bold" text-anchor="middle">Gestor de contenidos</text><text x="35" y="715.0" font-family="Arial, sans-serif" font-size="14" fill="#111111">El gestor crea, edita o desactiva preguntas de educación financiera con 2 a 4 opciones, 1 correcta, tema y dificultad. RF-49 transversal: ayuda de campos, errores y resultados comprensibles.</text><text x="35" y="815" font-family="Arial, sans-serif" font-size="12" fill="#111111">Notación: asociación continua; «include» obligatorio; «extend» condicional, dirigido hacia el caso base.</text><text x="1505" y="845" font-family="Arial, sans-serif" font-size="12" fill="#111111" text-anchor="middle">32</text></svg>