<svg xmlns="http://www.w3.org/2000/svg" width="1805" height="1017" viewBox="0 0 1805 1017" role="img"><title>CU-18 Detalle - Validar automáticamente una cuenta vinculada</title><rect width="100%" height="100%" fill="white"/><rect x="290" y="25" width="1150" height="792" rx="10" fill="#FFFFFF" stroke="#222" stroke-width="1.2"/><text x="865.0" y="49" font-family="Arial, sans-serif" font-size="16" fill="#111111" font-weight="bold" text-anchor="middle">Sistema SUMA</text><polyline points="1120.3,164.8 633.4,383.1" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4"/><polyline points="642.8,372.3 633.4,383.1 647.7,383.3" fill="none" stroke="#222" stroke-width="1.2"/><rect x="819.254150390625" y="265.969696969697" width="61.49169921875001" height="17" fill="white"/><text x="850" y="278.969696969697" font-family="Arial, sans-serif" font-size="13" fill="#111111" text-anchor="middle">«extend»</text><rect x="757.94091796875" y="285.969696969697" width="184.1181640625" height="15" fill="white"/><text x="850" y="296.969696969697" font-family="Arial, sans-serif" font-size="11" fill="#111111" text-anchor="middle">[cuenta aprobada automáticamente]</text><polyline points="665.8,389.9 1085.4,273.0" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4"/><polyline points="1074.5,282.2 1085.4,273.0 1071.2,270.7" fill="none" stroke="#222" stroke-width="1.2"/><rect x="818.171875" y="318.57575757575756" width="63.65625000000001" height="17" fill="white"/><text x="850" y="331.57575757575756" font-family="Arial, sans-serif" font-size="13" fill="#111111" text-anchor="middle">«include»</text><polyline points="707.1,406.8 1025.5,372.0" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4"/><polyline points="1013.2,379.4 1025.5,372.0 1011.9,367.5" fill="none" stroke="#222" stroke-width="1.2"/><rect x="818.171875" y="371.1818181818182" width="63.65625000000001" height="17" fill="white"/><text x="850" y="384.1818181818182" font-family="Arial, sans-serif" font-size="13" fill="#111111" text-anchor="middle">«include»</text><polyline points="1009.0,453.4 715.7,435.6" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4"/><polyline points="729.0,430.4 715.7,435.6 728.3,442.4" fill="none" stroke="#222" stroke-width="1.2"/><rect x="819.254150390625" y="423.78787878787875" width="61.49169921875001" height="17" fill="white"/><text x="850" y="436.78787878787875" font-family="Arial, sans-serif" font-size="13" fill="#111111" text-anchor="middle">«extend»</text><rect x="799.529296875" y="443.78787878787875" width="100.94140625" height="15" fill="white"/><text x="850" y="454.78787878787875" font-family="Arial, sans-serif" font-size="11" fill="#111111" text-anchor="middle">[incidencia técnica]</text><polyline points="1070.8,547.2 677.4,456.6" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4"/><polyline points="691.4,453.7 677.4,456.6 688.7,465.4" fill="none" stroke="#222" stroke-width="1.2"/><rect x="819.254150390625" y="476.3939393939394" width="61.49169921875001" height="17" fill="white"/><text x="850" y="489.3939393939394" font-family="Arial, sans-serif" font-size="13" fill="#111111" text-anchor="middle">«extend»</text><rect x="769.5693359375" y="496.3939393939394" width="160.861328125" height="15" fill="white"/><text x="850" y="507.3939393939394" font-family="Arial, sans-serif" font-size="11" fill="#111111" text-anchor="middle">[resultado resuelto y cambiado]</text><polyline points="1112.4,653.9 641.3,465.5" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4"/><polyline points="655.6,464.8 641.3,465.5 651.1,475.9" fill="none" stroke="#222" stroke-width="1.2"/><rect x="819.254150390625" y="529.0" width="61.49169921875001" height="17" fill="white"/><text x="850" y="542.0" font-family="Arial, sans-serif" font-size="13" fill="#111111" text-anchor="middle">«extend»</text><rect x="790.35546875" y="549.0" width="119.2890625" height="15" fill="white"/><text x="850" y="560.0" font-family="Arial, sans-serif" font-size="11" fill="#111111" text-anchor="middle">[hay referido asociado]</text><polyline points="1470.5,381.0 1270.5,277.5" fill="none" stroke="#222" stroke-width="1.2"/><ellipse cx="540.0" cy="425.0" rx="180.0" ry="49.0" fill="#DCE8F3" stroke="#222" stroke-width="1.3"/><text x="540.0" y="414.0" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">CU-18 Validar automáticamente una cuenta</text><text x="540.0" y="431.08" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">vinculada</text><text x="540.0" y="448.15999999999997" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">RF-05, RF-50</text><ellipse cx="1200.0" cy="129.0" rx="200.0" ry="39.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><text x="1200.0" y="126.0" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">CU-18.1 Generar código y enlace tras validar la</text><text x="1200.0" y="143.07999999999998" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">cuenta</text><ellipse cx="1200.0" cy="241.0" rx="200.0" ry="39.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><text x="1200.0" y="238.0" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">CU-18.2 Consultar titularidad y vigencia</text><text x="1200.0" y="255.07999999999998" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">institucional</text><ellipse cx="1200.0" cy="353.0" rx="200.0" ry="39.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><text x="1200.0" y="358.0" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">CU-18.3 Persistir resultado y evidencia del cotejo</text><ellipse cx="1200.0" cy="465.0" rx="200.0" ry="39.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><text x="1200.0" y="462.0" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">CU-18.4 Reintentar automáticamente la</text><text x="1200.0" y="479.08" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">validación</text><ellipse cx="1200.0" cy="577.0" rx="200.0" ry="39.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><text x="1200.0" y="582.0" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">CU-18.5 Notificar un resultado de validación</text><ellipse cx="1200.0" cy="689.0" rx="200.0" ry="39.0" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><text x="1200.0" y="694.0" font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">CU-06.2 Validar automáticamente un referido</text><rect x="1450" y="381.0" width="215" height="90" rx="7" fill="#E7E7E7" stroke="#222" stroke-width="1.2"/><text x="1557.5" y="401.0" font-family="Arial, sans-serif" font-size="12" fill="#111111" text-anchor="middle">«servicio externo»</text><text x="1557.5" y="425.0" font-family="Arial, sans-serif" font-size="14" fill="#111111" font-weight="bold" text-anchor="middle">Fuente institucional de la</text><text x="1557.5" y="442.08" font-family="Arial, sans-serif" font-size="14" fill="#111111" font-weight="bold" text-anchor="middle">Cooperativa</text><text x="35" y="877.0" font-family="Arial, sans-serif" font-size="14" fill="#111111">RF-50 obligatorio. Consultar fuente institucional autorizada y vigente, cotejar identidad, existencia, tipo, número y condición habilitada. Máximo 5 segundos con fuente disponible. Incidencia técnica: Pendiente y reintento cada 5 minutos. Sin saldos ni movimientos financieros.</text><text x="35" y="894.08" font-family="Arial, sans-serif" font-size="14" fill="#111111">RF-49 transversal: ayuda de campos, errores y resultados comprensibles.</text><text x="35" y="977" font-family="Arial, sans-serif" font-size="12" fill="#111111">Notación: asociación continua; «include» obligatorio; «extend» condicional, dirigido hacia el caso base.</text><text x="1760" y="1007" font-family="Arial, sans-serif" font-size="12" fill="#111111" text-anchor="middle">26</text></svg>